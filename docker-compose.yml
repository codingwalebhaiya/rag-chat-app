
services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "dist/server.js"]
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    init: true

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "dist/worker/worker.js"]
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
    restart: unless-stopped
    init: true
